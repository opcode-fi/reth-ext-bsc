# BSC node + rex bridge.
#
# Existing safeguards reflect earlier failures. Cache bounds are memory/performance
# tradeoffs; their effect on resident memory must be measured under the current workload.
#
# Build from a checkout of github.com/opcode-fi/reth-bsc:
#   docker build -t reth-bsc:local /path/to/reth-bsc
name: reth_bsc

services:
  reth_bsc:
    image: reth-bsc:local
    container_name: reth_bsc
    restart: unless-stopped
    user: "1000:1000"
    # Give MDBX time to finish a write transaction; a hard kill mid-commit is how you get a
    # corrupt datadir.
    stop_grace_period: 5m

    # MEMORY. Lowered 48g -> 34g on 2026-11-05: host-wide OOMs (constraint=CONSTRAINT_NONE)
    # returned. The node fell behind, its catch-up grew it to ~47 GB, the host ran out, and a
    # co-located Ethereum node lost its page cache and stalled for two hours. A kill loop
    # inside this container's own ceiling (below) is the lesser failure on a shared host.
    #
    # Raised 34g -> 48g on 2026-11-03 after seven cgroup OOM kills in 24 hours.
    #
    # Every one was constraint=CONSTRAINT_MEMCG -- its own ceiling, not host pressure -- and
    # the RSS at kill was 32.2-32.5 GB each time, i.e. it reliably wants ~32.4 GB and 34g
    # left no room. The failure compounds: killed -> restart -> must catch up -> catch-up
    # costs MORE than steady state -> killed again.
    #
    # 34g was chosen when the node peaked at 25-30 GB on a host with ~24 GB spare. Both
    # changed: the working set grew, and the host now has ~57 GB available. 48g lets it
    # finish a catch-up, after which it settles back to the 10-23 GB steady state.
    #
    # If host-wide OOMs (constraint=CONSTRAINT_NONE) reappear, this is the first thing to
    # lower again -- that is what 48g caused in August, on a fuller host.
    #
    # The failure this prevents is subtler than it looks: every kill we saw was a HOST-wide
    # OOM, not this container hitting its own ceiling. reth-bsc was simply the fattest
    # process when the host ran out of memory. A limit that is too generous does not protect
    # it just makes this the process the kernel picks.
    mem_limit: 34g
    mem_reservation: 12g
    # Biases the kernel away from choosing this process. Note this shifts risk onto the next
    # fattest process rather than removing it -- the real fix is host headroom.
    oom_score_adj: -500

    # CPU. Unbounded, this node drove load average to ~2.5x the core count and fell off the tip,
    # which is the trigger behind both failure modes we root-caused. cpu_shares (default
    # 1024) raises its scheduling weight so contention does not push it behind.
    cpus: "24"
    cpu_shares: 4096

    # Below 131072, core v0.1.3 retains the previous 512-reader RocksDB table cache.
    # Set both limits because startup raises the soft limit to the hard limit.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

    ports:
      - "30313:30313/tcp"
      - "30313:30313/udp"
      - "127.0.0.1:8565:8545"     # RPC   (8545 is the Ethereum node's)
      - "127.0.0.1:8566:8546"     # WS
      - "127.0.0.1:6060:6060"     # metrics
      - "127.0.0.1:10001:10000"   # rex   (10000 is the Ethereum node's)

    volumes:
      - ${BSC_DATADIR:-./data}:/data

    command:
      - "node"
      - "--chain=bsc"
      - "--datadir=/data"
      - "--db.sync-mode=safe-no-sync"

      # TEMPORARY, and it should be removed once there is a quiet window for it.
      #
      # This disables the consensus check that would have caught a state-root divergence in
      # minutes rather than hours -- and the Ethereum node runs without it. But turning it on
      # requires reth to first rebuild intermediate trie nodes that were never maintained
      # while it was set: a full walk of ~749 GB of state (293M storage leaves). That rebuild
      # was measured to exceed both 28 GB and 36 GB, OOMing twice, so the node cannot make
      # progress with it on.
      #
      # A node at tip without the alarm beats a node that cannot sync. TO REMOVE: schedule
      # the rebuild with >36 GB of headroom, once.
      - "--engine.skip-state-root-validation"

      # Bound the cross-block cache to 512 MiB. Lower cache capacity can increase state
      # reads and reduce throughput; the capacity reduction is not measured RSS savings.
      - "--engine.cross-block-cache-size=512"
      - "--engine.persistence-backpressure-threshold=256"

      - "--port=30313"
      - "--discovery.port=30313"
      - "--http"
      - "--http.addr=0.0.0.0"
      - "--http.port=8545"
      - "--http.api=eth,net,web3,txpool,debug"
      - "--http.corsdomain=*"
      - "--ws"
      - "--ws.addr=0.0.0.0"
      - "--ws.port=8546"
      - "--ws.origins=*"
      - "--ws.api=eth,net,web3,txpool,debug"
      - "--rpc.max-tracing-requests=12"
      - "--rpc.max-blocking-io-requests=32"
      - "--rpc-cache.max-concurrent-db-requests=256"
      # Bound retained block and receipt entries at the cost of more cache misses/reloads.
      - "--rpc-cache.max-blocks=1000"
      - "--rpc-cache.max-receipts=500"
      - "--rpc.max-connections=64"
      - "--rpc.pending-block=none"
      - "--metrics=0.0.0.0:6060"
      # bsc::block_import is warn because it is extremely chatty at BSC block rates;
      # bsc::rex is debug so bridge sends can be counted against canonical commits.
      - "--log.stdout.filter=info,bsc::block_import=warn,bsc::rex=debug"

    healthcheck:
      test: ["CMD", "perl", "-MIO::Socket::INET", "-e", "$$s=IO::Socket::INET->new(PeerAddr=>'127.0.0.1:8545',Timeout=>5) or exit 1; $$b='{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"eth_blockNumber\",\"params\":[]}'; print $$s \"POST / HTTP/1.1\\r\\nHost: localhost\\r\\nContent-Type: application/json\\r\\nContent-Length: \".length($$b).\"\\r\\nConnection: close\\r\\n\\r\\n$$b\"; local $$/; $$r=<$$s>; exit($$r=~/\"result\":\"0x/ ? 0 : 1)"]
      interval: 60s
      timeout: 10s
      retries: 3
      # Initial sync is long; a shorter window just marks a healthy node unhealthy.
      start_period: 30m

    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "3"
